version: 2
updates:
  # NuGet packages — one entry per project directory, because Dependabot needs the
  # directory that actually contains the .csproj (there is no .sln at the repo root).
  - package-ecosystem: "nuget"
    directory: "/Luces.Mediator"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "nuget"
    directory: "/Luces.Mediator.SourceGen"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Keeps actions/checkout, actions/setup-dotnet, NuGet/login, ... up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
