name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # stable release, e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # pre-release, e.g. v1.2.3-rc.1

permissions:
  contents: read
  id-token: write   # required by NuGet/login to exchange the GitHub OIDC token for a short-lived key

jobs:
  nuget:
    name: publish to nuget.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive the package version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Builds the project (and the SourceGen analyzer it references) then packs it.
      # Targets the project explicitly (not the solution) so the produced nupkg is deterministic.
      - name: Pack
        run: dotnet pack Luces.Mediator/Luces.Mediator.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      # Trusted publishing (OIDC): no long-lived API key is stored in the repository.
      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
